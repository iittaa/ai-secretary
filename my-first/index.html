<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(ellipse at center, #0f1729 0%, #050813 100%);
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .glow {
        position: absolute;
        width: 1100px;
        height: 1100px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(0, 212, 255, 0.28) 0%, transparent 65%);
        filter: blur(80px);
        z-index: 0;
      }
      .stage {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
        gap: 36px;
      }
      .emoji {
        font-size: 220px;
        line-height: 1;
      }
      .title {
        font-size: 184px;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: -3px;
        text-align: center;
        text-shadow: 0 0 40px rgba(0, 212, 255, 0.5);
      }
      .subtitle {
        font-size: 44px;
        font-weight: 600;
        color: #00d4ff;
        letter-spacing: 12px;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <div class="glow clip" id="glow" data-start="0" data-duration="5" data-track-index="0"></div>
      <div class="stage">
        <div class="emoji clip" id="emoji" data-start="0" data-duration="5" data-track-index="1">🚀</div>
        <div class="title clip" id="title" data-start="0" data-duration="5" data-track-index="2">
          ジョン起動完了！
        </div>
        <div class="subtitle clip" id="subtitle" data-start="0" data-duration="5" data-track-index="3">
          JOHN ONLINE
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from("#glow", { scale: 0.4, opacity: 0, duration: 1.1, ease: "power2.out" }, 0.1);
      tl.from(
        "#emoji",
        { scale: 0, opacity: 0, rotation: -180, duration: 0.85, ease: "back.out(1.7)" },
        0.25
      );
      tl.from(
        "#title",
        { y: 70, scale: 0.92, opacity: 0, duration: 0.75, ease: "expo.out" },
        0.55
      );
      tl.from("#subtitle", { y: 20, opacity: 0, duration: 0.6, ease: "power3.out" }, 0.95);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
